<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="120 60 820 820">
  <defs>
    <radialGradient id="orbA" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#FFD1EC"/>
      <stop offset="0.45" stop-color="#FF7AC6"/>
      <stop offset="1" stop-color="#A24BFF"/>
    </radialGradient>
    <radialGradient id="orbB" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#D9FFF6"/>
      <stop offset="0.45" stop-color="#5EE6D0"/>
      <stop offset="1" stop-color="#3B8CFF"/>
    </radialGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6FB5"/>
      <stop offset="0.5" stop-color="#A45CFF"/>
      <stop offset="1" stop-color="#3FA9FF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#7A3FD1" flood-opacity="0.25"/>
    </filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- clone beam: dotted arc from original to clone -->
  <path d="M 400 232 Q 520 110 630 222" fill="none" stroke="#FFC94D" stroke-width="14"
        stroke-linecap="round" stroke-dasharray="2 30"/>
  <path d="M 638 196 L 645 235 L 606 228" fill="none" stroke="#FFC94D" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- original orb -->
  <g transform="translate(320 420)">
    <circle r="170" fill="url(#orbA)" filter="url(#soft)"/>
    <ellipse cx="-60" cy="-80" rx="52" ry="32" fill="#fff" opacity="0.75" transform="rotate(-30 -60 -80)"/>
    <circle cx="8" cy="-115" r="10" fill="#fff" opacity="0.8"/>
    <ellipse cx="-50" cy="12" rx="17" ry="23" fill="#3A1A4F"/>
    <ellipse cx="50" cy="12" rx="17" ry="23" fill="#3A1A4F"/>
    <circle cx="-44" cy="3" r="6" fill="#fff"/>
    <circle cx="56" cy="3" r="6" fill="#fff"/>
    <ellipse cx="-90" cy="55" rx="26" ry="14" fill="#FF4FA0" opacity="0.55"/>
    <ellipse cx="90" cy="55" rx="26" ry="14" fill="#FF4FA0" opacity="0.55"/>
    <path d="M -22 55 Q 0 78 22 55" fill="none" stroke="#3A1A4F" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- clone orb (same size) -->
  <g transform="translate(720 420)">
    <circle r="170" fill="url(#orbB)" filter="url(#soft)"/>
    <circle r="192" fill="none" stroke="#5EE6D0" stroke-width="8"
            stroke-dasharray="4 22" stroke-linecap="round" opacity="0.9"/>
    <ellipse cx="-60" cy="-80" rx="52" ry="32" fill="#fff" opacity="0.75" transform="rotate(-30 -60 -80)"/>
    <circle cx="8" cy="-115" r="10" fill="#fff" opacity="0.8"/>
    <ellipse cx="-50" cy="12" rx="17" ry="23" fill="#16324F"/>
    <circle cx="-44" cy="3" r="6" fill="#fff"/>
    <path d="M 32 14 Q 50 0 68 14" fill="none" stroke="#16324F" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="-90" cy="55" rx="26" ry="14" fill="#FF6FB5" opacity="0.5"/>
    <ellipse cx="90" cy="55" rx="26" ry="14" fill="#FF6FB5" opacity="0.5"/>
    <path d="M -22 55 Q 0 78 22 55" fill="none" stroke="#16324F" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- sparkles -->
  <g fill="#FFC94D">
    <path d="M 515 300 l 10 26 l 26 10 l -26 10 l -10 26 l -10 -26 l -26 -10 l 26 -10 z"/>
    <path d="M 905 200 l 7 18 l 18 7 l -18 7 l -7 18 l -7 -18 l -18 -7 l 18 -7 z"/>
    <path d="M 160 190 l 8 20 l 20 8 l -20 8 l -8 20 l -8 -20 l -20 -8 l 20 -8 z" fill="#FF8FCB"/>
  </g>
  <circle cx="925" cy="560" r="9" fill="#A45CFF"/>
  <circle cx="520" cy="560" r="7" fill="#FF8FCB"/>
  <circle cx="140" cy="500" r="8" fill="#5EE6D0"/>

  <!-- wordmark with white glow -->
  <ellipse cx="525" cy="735" rx="300" ry="70" fill="#fff" opacity="0.85" filter="url(#glow)"/>
  <text x="525" y="800" text-anchor="middle" font-family="Arial Rounded MT Bold"
        font-size="200" letter-spacing="4" fill="#fff" stroke="#fff" stroke-width="26"
        stroke-linejoin="round" filter="url(#glow)">clorb</text>
  <text x="525" y="800" text-anchor="middle" font-family="Arial Rounded MT Bold"
        font-size="200" letter-spacing="4" fill="url(#text)">clorb</text>
</svg>
